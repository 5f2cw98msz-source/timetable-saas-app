<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/bare :: page('Join', ~{:: main})}" lang="en">
<body>
<main>
    <h1 class="card-title">Join <span th:text="${organisation.name}">Institution</span></h1>
    <p class="card-sub">
        This creates a lecturer account with its own private timetable.
    </p>

    <div class="alert alert-error" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form th:action="@{'/join/' + ${organisation.slug}}" method="post" th:object="${form}" class="form">
        <label class="field">
            <span class="field-label">Your name</span>
            <input type="text" th:field="*{displayName}" autocomplete="name" required autofocus>
        </label>

        <label class="field">
            <span class="field-label">Work email</span>
            <input type="email" th:field="*{email}" autocomplete="username"
                   autocapitalize="none" spellcheck="false" required>
        </label>

        <label class="field">
            <span class="field-label">Password</span>
            <input type="password" th:field="*{password}" autocomplete="new-password" required>
            <span class="field-hint">
                At least <span th:text="${minPasswordLength}">8</span> characters.
            </span>
        </label>

        <button type="submit" class="btn btn-primary btn-block btn-lg">Create my account</button>
    </form>

    <p class="card-foot">
        Already have an account? <a th:href="@{/login}">Sign in</a>
    </p>
</main>
</body>
</html>
