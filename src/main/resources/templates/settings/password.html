<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/app :: page('Change password', ~{:: main})}" lang="en">
<body>
<main>
    <div class="page-narrow">
        <h1 class="page-title">Change your password</h1>

        <div class="alert alert-info" th:if="${forced}">
            This account is using a password somebody else chose for it.
            Pick your own before carrying on.
        </div>

        <div class="alert alert-error" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <form th:action="@{/settings/password}" method="post" th:object="${form}" class="form card">
            <label class="field">
                <span class="field-label">Current password</span>
                <input type="password" th:field="*{currentPassword}"
                       autocomplete="current-password" required autofocus>
            </label>

            <label class="field">
                <span class="field-label">New password</span>
                <input type="password" th:field="*{newPassword}" autocomplete="new-password" required>
                <span class="field-hint">
                    At least <span th:text="${minPasswordLength}">8</span> characters.
                </span>
            </label>

            <label class="field">
                <span class="field-label">Confirm new password</span>
                <input type="password" th:field="*{confirmPassword}" autocomplete="new-password" required>
            </label>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Change password</button>
                <a class="btn btn-quiet" th:href="@{/settings/account}" th:unless="${forced}">Cancel</a>
            </div>
        </form>

        <p class="page-sub">You will be signed out and asked to sign in again with the new password.</p>
    </div>
</main>
</body>
</html>
