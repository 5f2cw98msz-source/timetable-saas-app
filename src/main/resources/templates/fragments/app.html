<!DOCTYPE html>
<!--
  The shell for everything you see once signed in.

  Used from a page like this:
      <html th:replace="~{fragments/app :: page('Timetable', ~{:: main})}">
      <body><main> ... </main></body>
      </html>
-->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="page(pageTitle, content)"
      lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle} + ' | ' + ${productName}">Chalkline</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
</head>
<body>

<header class="topbar">
    <div class="topbar-inner">
        <a class="brand" th:href="@{/timetable}">
            <span class="brand-mark" aria-hidden="true">C</span>
            <span class="brand-text" th:text="${productName}">Chalkline</span>
        </a>

        <nav class="nav" aria-label="Main">
            <a th:href="@{/timetable}" class="nav-link">Timetable</a>
            <th:block sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/settings/catalogue}" class="nav-link">Rooms &amp; courses</a>
                <a th:href="@{/settings/team}" class="nav-link">Team</a>
                <a th:href="@{/settings/integrations}" class="nav-link">Integrations</a>
            </th:block>
            <a th:href="@{/settings/account}" class="nav-link">Settings</a>
        </nav>

        <div class="account">
            <span class="chip" th:classappend="${me?.premium} ? 'chip-plan' : 'chip-free'"
                  th:text="${me?.plan?.label}">Free</span>

            <a class="account-link" th:href="@{/settings/account}" th:title="${me?.username}">
                <span class="avatar" th:text="${me?.initials}">AB</span>
                <span class="account-name" th:text="${me?.displayName}">Name</span>
            </a>

            <form th:action="@{/logout}" method="post" class="inline">
                <button type="submit" class="btn btn-ghost btn-sm">Sign out</button>
            </form>
        </div>
    </div>
</header>

<div class="page">
    <div th:replace="~{fragments/flash :: banners}"></div>
    <div th:replace="${content}">Page content</div>
</div>

<footer class="footer">
    <span th:text="${me?.organisationName}">Institution</span>
    &middot; powered by <span th:text="${productName}">Chalkline</span>
    &middot; <a th:href="'mailto:' + ${supportEmail}" th:text="${supportEmail}">support</a>
</footer>

<script th:src="@{/js/app.js}" defer></script>
</body>
</html>
